services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: envmon
      POSTGRES_USER: envmon
      POSTGRES_PASSWORD: envmon
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U envmon -d envmon"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://envmon:envmon@db:5432/envmon
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
